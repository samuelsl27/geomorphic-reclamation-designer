name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check --output-format=github .
      # `ruff format --check` NO se ejecuta a proposito: reformatear de golpe el
      # motor existente daria un diff gigante donde no se veria ningun cambio
      # real. Ver [tool.ruff.format] en pyproject.toml y P-14.

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 es el minimo que trae QGIS 3.22; 3.12 el de QGIS 4.x
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      # Los tests que necesitan QGIS se saltan solos: en CI corren los del
      # motor puro (libro, hidraulica, divisorias, checks, optimizador).
      - run: pytest -q

  build:
    name: Construir el ZIP
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: La guia generada debe estar al dia
        run: |
          python scripts/genera_guia.py
          git diff --exit-code src/geomorphic_reclamation_designer/help/guide.html || {
            echo "::error::help/guide.html no coincide con scripts/guia_datos.py."
            echo "::error::Ejecuta 'python scripts/genera_guia.py' y confirma el cambio."
            exit 1
          }
      - run: python scripts/build_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: dist/*.zip
          if-no-files-found: error

  metadata:
    name: Coherencia de metadatos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: La version coincide en los cuatro sitios
        run: python scripts/build_zip.py --salida /tmp/comprobacion
      - name: CHANGELOG menciona la version de metadata.txt
        run: |
          V=$(grep -oP '^version=\K.*' src/geomorphic_reclamation_designer/metadata.txt)
          grep -q "\[$V\]" CHANGELOG.md || {
            echo "::warning::CHANGELOG.md no tiene una entrada [$V]"
          }
